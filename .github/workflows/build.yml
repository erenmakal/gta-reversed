name: Build

env:
    # Compile in parallel where possible.
    CL: /MP

    # Path to the CMake build directory.
    build: "${{ github.workspace }}/build"

# Triggers the workflow on push or pull request events for all branches.
on: [push, pull_request]

permissions:
    contents: read

jobs:
    build:
        permissions:
            contents: read # for actions/checkout to fetch code
        strategy:
            fail-fast: false
            matrix:
                os: [windows-2025-vs2026]
                arch: [x86]
                conf: [Debug, Release]
                preset: [NoUnity, Unity]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup CMake using Conan
              uses: ./.github/actions/setup-cmake
              with:
                  os: ${{ matrix.os }}
                  arch: ${{ matrix.arch }}
                  conf: ${{ matrix.conf }}
                  preset: ${{ matrix.preset }}

            - name: Build
              shell: cmd
              run: cmake --build build --config ${{ matrix.conf }}

            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: gta_reversed-${{ matrix.conf }}-${{ matrix.preset }}
                  path: bin/${{ matrix.conf }}

    full-compat-package:
        name: Full Compatibility Package
        if: github.event_name == 'push'
        needs: build
        runs-on: windows-2025-vs2026
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Download gta-reversed Release Unity build
              uses: actions/download-artifact@v7
              with:
                  name: gta_reversed-Release-Unity
                  path: staging/gta-reversed

            - name: Download and verify SilentPatchSA Build 34.1
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $url = 'https://github.com/CookiePLMonster/SilentPatch/releases/download/1.1-BUILD34.1-SA/SilentPatchSA.zip'
                  $zip = Join-Path $env:RUNNER_TEMP 'SilentPatchSA.zip'
                  Invoke-WebRequest -Uri $url -OutFile $zip

                  $expected = '0837bbdc0548a4a952f924adefd2bb6eacc866407f153844fe1f56995668c42c'
                  $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
                  if ($actual -ne $expected) {
                      throw "SilentPatchSA.zip SHA-256 mismatch. Expected $expected, got $actual"
                  }

                  New-Item -ItemType Directory -Force -Path staging/SilentPatch | Out-Null
                  Expand-Archive -Path $zip -DestinationPath staging/SilentPatch -Force

            - name: Assemble install-ready package
              shell: pwsh
              run: |
                  $ErrorActionPreference = 'Stop'
                  $pkg = 'package'
                  $scripts = Join-Path $pkg 'scripts'
                  New-Item -ItemType Directory -Force -Path $scripts | Out-Null

                  $asi = Get-ChildItem -Path staging/gta-reversed -Recurse -Filter 'gta_reversed.asi' | Select-Object -First 1
                  if (-not $asi) { throw 'gta_reversed.asi was not produced by the Release Unity build.' }
                  Copy-Item $asi.FullName (Join-Path $scripts 'gta_reversed.asi')

                  # SilentPatch supports loading from the game root or scripts depending on the ASI loader.
                  # Keep its original file names/config so its self-detection and INI lookup remain intact.
                  Get-ChildItem -Path staging/SilentPatch -Recurse -File | ForEach-Object {
                      Copy-Item $_.FullName (Join-Path $scripts $_.Name) -Force
                  }

                  Copy-Item 'THIRD_PARTY/SilentPatch-LICENSE.txt' (Join-Path $pkg 'SilentPatch-LICENSE.txt')

                  @'
                  GTA San Andreas - gta-reversed Modern Compatibility

                  Install:
                  1. Use the GTA San Andreas 1.0 US Compact executable expected by gta-reversed.
                  2. Install a compatible ASI loader (Silent's ASI Loader / Ultimate ASI Loader).
                  3. Copy the contents of this package to the GTA San Andreas directory.

                  Included:
                  - gta_reversed.asi: source-level reverse-engineered engine fixes and high-refresh work.
                  - SilentPatchSA: official Build 34.1 fallback/coverage for SilentPatch fixes not yet source-ported.

                  The source-level ports are gradually replacing overlapping SilentPatch fixes. Keeping
                  SilentPatchSA in the Full Compatibility package ensures the remaining official fixes are
                  still available while that migration is in progress.
                  '@ | Set-Content -Path (Join-Path $pkg 'INSTALL.txt') -Encoding UTF8

            - name: Upload Full Compatibility package
              uses: actions/upload-artifact@v7
              with:
                  name: gta-reversed-ModernSA-FullCompatibility
                  path: package
