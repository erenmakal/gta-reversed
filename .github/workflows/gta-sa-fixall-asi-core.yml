name: GTA SA FixAll ASI PS2

on:
  push:
    branches: [build/gta-sa-fixall-asi-core]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ready-to-install FixAll package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD 'out'
          $scripts = Join-Path $root 'scripts'
          $presets = Join-Path $root 'PRESETS\180FPS-EXPERIMENTAL'
          $tmp = Join-Path $PWD 'downloads'
          New-Item -ItemType Directory -Force -Path $root,$scripts,$presets,$tmp | Out-Null

          function Download-Zip([string]$Url,[string]$Name) {
            $zip = Join-Path $tmp $Name
            Invoke-WebRequest -UseBasicParsing -Uri $Url -OutFile $zip
            return $zip
          }
          function Expand-Zip([string]$Zip,[string]$Name) {
            $dir = Join-Path $tmp $Name
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
            Expand-Archive -Path $Zip -DestinationPath $dir -Force
            return $dir
          }
          function Copy-SiblingTree([System.IO.FileInfo]$Marker,[string]$Destination) {
            New-Item -ItemType Directory -Force -Path $Destination | Out-Null
            Get-ChildItem $Marker.Directory.FullName -Force | ForEach-Object {
              if ($_.Name -notin @('dinput8.dll','vorbisFile.dll','vorbisHooked.dll','ddraw.dll')) {
                Copy-Item $_.FullName $Destination -Recurse -Force
              }
            }
          }

          # SilentPatch SA Build 34.1
          $z = Download-Zip 'https://github.com/CookiePLMonster/SilentPatch/releases/download/1.1-BUILD34.1-SA/SilentPatchSA.zip' 'SilentPatchSA.zip'
          $d = Expand-Zip $z 'silentpatch'
          $asi = Get-ChildItem $d -Recurse -File -Filter 'SilentPatchSA.asi' | Select-Object -First 1
          $ini = Get-ChildItem $d -Recurse -File -Filter 'SilentPatchSA.ini' | Select-Object -First 1
          if (-not $asi -or -not $ini) { throw 'SilentPatch files not found' }
          Copy-Item $asi.FullName (Join-Path $root 'SilentPatchSA.asi') -Force
          Copy-Item $ini.FullName (Join-Path $root 'SilentPatchSA.ini') -Force
          $spIniPath = Join-Path $root 'SilentPatchSA.ini'
          $t = Get-Content $spIniPath -Raw
          if ($t -match '(?m)^UseDesktopRefreshRate\s*=') {
            $t = [regex]::Replace($t,'(?m)^UseDesktopRefreshRate\s*=.*$','UseDesktopRefreshRate=1')
          } else { $t += "`r`nUseDesktopRefreshRate=1`r`n" }
          Set-Content $spIniPath $t -Encoding ASCII

          # Widescreen Fix
          $z = Download-Zip 'https://github.com/ThirteenAG/WidescreenFixesPack/releases/download/gtasa/GTASA.WidescreenFix.zip' 'GTASA.WidescreenFix.zip'
          $d = Expand-Zip $z 'widescreen'
          $asi = Get-ChildItem $d -Recurse -File -Filter 'GTASA.WidescreenFix.asi' | Select-Object -First 1
          $ini = Get-ChildItem $d -Recurse -File -Filter 'GTASA.WidescreenFix.ini' | Select-Object -First 1
          if (-not $asi -or -not $ini) { throw 'Widescreen Fix files not found' }
          Copy-Item $asi.FullName (Join-Path $scripts 'GTASA.WidescreenFix.asi') -Force
          Copy-Item $ini.FullName (Join-Path $scripts 'GTASA.WidescreenFix.ini') -Force
          Get-ChildItem $asi.Directory.FullName -File | Where-Object { $_.Name -notin @('GTASA.WidescreenFix.asi','GTASA.WidescreenFix.ini','dinput8.dll') } | ForEach-Object { Copy-Item $_.FullName $scripts -Force }

          # Ultimate ASI Loader x86
          $z = Download-Zip 'https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/Win32-latest/dinput8-Win32.zip' 'dinput8-Win32.zip'
          $d = Expand-Zip $z 'ual'
          $loader = Get-ChildItem $d -Recurse -File -Filter 'dinput8.dll' | Select-Object -First 1
          if (-not $loader) { throw 'ASI Loader not found' }
          Copy-Item $loader.FullName (Join-Path $root 'dinput8.dll') -Force

          # Mod Loader v0.3.10
          $z = Download-Zip 'https://github.com/thelink2012/modloader/releases/download/v0.3.10/modloader.zip' 'modloader.zip'
          $d = Expand-Zip $z 'modloaderpkg'
          $marker = Get-ChildItem $d -Recurse -File -Filter 'modloader.asi' | Select-Object -First 1
          if (-not $marker) { throw 'modloader.asi not found' }
          Copy-SiblingTree $marker $scripts
          New-Item -ItemType Directory -Force -Path (Join-Path $scripts 'modloader') | Out-Null

          # SkyGfx v4.2b - PS2 only, never Xbox pipeline
          $z = Download-Zip 'https://github.com/aap/skygfx/releases/download/v4.2b/SkyGfx_SA_4.2b.zip' 'SkyGfx_SA_4.2b.zip'
          $d = Expand-Zip $z 'skygfxpkg'
          $marker = Get-ChildItem $d -Recurse -File | Where-Object { $_.Name -ieq 'skygfx.asi' } | Select-Object -First 1
          if (-not $marker) { throw 'SkyGfx ASI not found' }
          Copy-SiblingTree $marker $scripts
          Get-ChildItem $scripts -File -Filter '*.ini' | Where-Object { $_.Name -like 'skygfx*.ini' } | ForEach-Object {
            $x = Get-Content $_.FullName -Raw
            if ($x -match '(?im)^\s*buildingPipe\s*=') { $x = [regex]::Replace($x,'(?im)^\s*buildingPipe\s*=.*$','buildingPipe=PS2') }
            if ($x -match '(?im)^\s*vehiclePipe\s*=') { $x = [regex]::Replace($x,'(?im)^\s*vehiclePipe\s*=.*$','vehiclePipe=PS2') }
            Set-Content $_.FullName $x -Encoding ASCII
          }

          # Project2DFX official GTASA release. Its binary is commonly named SA_LodLights.asi;
          # use SALodLights.ini as a reliable marker if the ASI name changes.
          $z = Download-Zip 'https://github.com/ThirteenAG/III.VC.SA.IV.Project2DFX/releases/download/gtasa/SA.Project2DFX.zip' 'SA.Project2DFX.zip'
          $d = Expand-Zip $z 'project2dfx'
          $marker = Get-ChildItem $d -Recurse -File | Where-Object {
            $_.Name -ieq 'SALodLights.ini' -or $_.Name -like '*LodLights*.asi' -or $_.Name -like '*Project2DFX*.asi'
          } | Select-Object -First 1
          if (-not $marker) {
            Get-ChildItem $d -Recurse -File | Select-Object FullName,Length | Format-Table -AutoSize
            throw 'Project2DFX marker not found'
          }
          Copy-SiblingTree $marker $scripts

          # Open Limit Adjuster v1.7.0, copied last so it replaces any older copy bundled with 2DFX.
          $z = Download-Zip 'https://github.com/GTAmodding/III.VC.SA.LimitAdjuster/releases/download/v1.7.0/III.VC.SA.LimitAdjuster.zip' 'III.VC.SA.LimitAdjuster.zip'
          $d = Expand-Zip $z 'olapkg'
          $marker = Get-ChildItem $d -Recurse -File | Where-Object { $_.Name -like '*LimitAdjuster*.asi' } | Select-Object -First 1
          if (-not $marker) { throw 'Open Limit Adjuster ASI not found' }
          Copy-SiblingTree $marker $scripts

          # Framerate Vigilante: stable 60 FPS / 180 Hz default + optional 180 FPS preset.
          Invoke-WebRequest -UseBasicParsing -Uri 'https://files.adv-rp.com/static/resources/advlauncher2/data/GTA/scripts/FramerateVigilante.SA.asi' -OutFile (Join-Path $scripts 'FramerateVigilante.SA.asi')
          @'
          [Settings]
          FPSlimit = 60
          RefreshRate = 180
          AutoLimitFPS = 1
          '@ | Set-Content (Join-Path $scripts 'FramerateVigilante.ini') -Encoding ASCII
          @'
          [Settings]
          FPSlimit = 180
          RefreshRate = 180
          AutoLimitFPS = 1
          '@ | Set-Content (Join-Path $presets 'FramerateVigilante.ini') -Encoding ASCII

          @'
          GTA SAN ANDREAS - FIXALL ASI + PS2 CORE v2 (1.0 US)
          ====================================================
          gta-reversed ve gta_sa.exe dahil degildir.

          DAHIL:
          - SilentPatch SA Build 34.1
          - Ultimate ASI Loader x86
          - Mod Loader v0.3.10
          - Widescreen Fix
          - Framerate Vigilante
          - Open Limit Adjuster v1.7.0
          - SkyGfx v4.2b (PS2 building/vehicle pipeline; Xbox secilmez)
          - Project2DFX

          VARSAYILAN: 60 FPS oyun + 180 Hz monitor. 180 FPS preset PRESETS klasorundedir.

          Xbox Map Features eklenmedi. SilentPatch tam PS2 Map + Fixes degildir: SilentPatch
          kod/engine hatalarini ve bazi PS2 davranislarini geri getirir; PS2 Map + Fixes ise
          IPL/IDE/COL tabanli ayri bir harita modudur.

          Proper Fixes bu ZIP'e konmadi: guncel Proper Fixes Xbox Map Features dahil farkli
          harita paketlerinden parcalar iceriyor ve gelistiricileri reupload yapilmamasini tercih ediyor.
          Boylece Xbox icerigini yanlislikla paketlemiyoruz ve guncelleme/reupload politikasina uyuyoruz.

          NoDEP guvenlik nedeniyle eklenmedi; CLEO aktif script olmadigi icin eklenmedi; MixSets
          gameplay ayarlarini fazla genis degistirdigi icin cekirdege eklenmedi; kozmetik 4K loadscreen
          ve Atmosphere UI de zorunlu bugfix olmadigi icin eklenmedi.

          KURULUM: ZIP'i temiz GTA SA 1.0 US klasorunde gta_sa.exe'nin yanina cikart.
          Oyun Frame Limiter'i acik kalsin. Eski ayni mod/loader kopyalarini once yedekle.
          '@ | Set-Content (Join-Path $root 'README_TR.txt') -Encoding UTF8

          @'
          STEAM IMPROVED CLASSIC REHBERI - SECIMLER
          =========================================
          DAHIL: SilentPatch, ASI Loader, Mod Loader, Widescreen Fix, Framerate Vigilante,
          Open Limit Adjuster, SkyGfx (PS2), Project2DFX.

          HARIC: Xbox Map Features ve Xbox render pipeline.
          AYRI TUTULDU: Proper Fixes ve eski map/texture paketleri (Xbox karisimi/reupload ve
          cakisma riski), GInput (gamepad opsiyonel), CLEO (aktif script yok), NoDEP, MixSets,
          4K Loadscreens ve Atmosphere Interface.
          '@ | Set-Content (Join-Path $root 'GUIDE_MOD_STATUS_TR.txt') -Encoding UTF8

          $manifest = @()
          Get-ChildItem $root -Recurse -File | Where-Object { $_.Extension -in @('.dll','.asi') } | ForEach-Object {
            $h = Get-FileHash $_.FullName -Algorithm SHA256
            $manifest += ('{0}  {1}' -f $h.Hash.ToLowerInvariant(),$_.FullName.Substring($root.Length + 1))
          }
          $manifest | Sort-Object | Set-Content (Join-Path $root 'SHA256SUMS.txt') -Encoding ASCII
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath (Join-Path $PWD 'GTA-SA-FixAll-ASI-PS2-v2-1.0US.zip') -CompressionLevel Optimal -Force

      - name: Show package contents
        shell: pwsh
        run: |
          Get-ChildItem out -Recurse -File | Select-Object FullName,Length
          Get-Content out\SHA256SUMS.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: GTA-SA-FixAll-ASI-PS2-v2-1.0US
          path: GTA-SA-FixAll-ASI-PS2-v2-1.0US.zip
          if-no-files-found: error
          retention-days: 30
